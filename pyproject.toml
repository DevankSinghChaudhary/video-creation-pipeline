[project]
name = "core"
version = "0.1.0"
description = "Video editing pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "beautifulsoup4>=4.14.3",
    "certifi==2026.5.20",
    "charset-normalizer==3.4.7",
    "colorama==0.4.6",
    "ddgs>=9.14.4",
    "distro==1.9.0",
    "dotenv==0.9.9",
    "ffmpeg>=1.4",
    "ffmpeg-python>=0.2.0",
    "gradio>=6.18.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.17",
    "jiter==0.15.0",
    "langchain[openai]>=1.3.2",
    "langgraph>=1.2.2",
    "lxml>=6.1.1",
    "openai==2.38.0",
    "pillow>=12.2.0",
    "playwright>=1.60.0",
    "playwright-stealth>=2.0.3",
    "pydantic==2.13.4",
    "pydantic-ai>=1.104.0",
    "pydantic-core==2.46.4",
    "python-dotenv==1.2.2",
    "qdrant-client>=1.18.0",
    "requests==2.34.2",
    "sniffio==1.3.1",
    "tqdm==4.67.3",
    "trafilatura>=2.0.0",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3==2.7.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
